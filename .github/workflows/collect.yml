name: 실시간 수집

# GitHub 예약 실행(cron)은 사용량이 많을 때 몇 시간씩 밀리거나 건너뛰어집니다.
# 그래서 한 번 시작하면 약 5시간 45분 동안 계속 수집하고, 끝날 때 다음 수집을 직접 이어서 시작합니다(이어달리기).
# 예약 실행은 이어달리기가 혹시 끊겼을 때 다시 살려 주는 비상용입니다.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

# 수집 작업은 항상 1개만. 실행 중에 새 요청이 오면 끊지 않고 대기했다가 이어서 시작합니다.
concurrency:
  group: market-pulse-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 1분 간격 수집 (최대 5시간 45분)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ECOS_KEY: ${{ secrets.ECOS_KEY }}
          REB_KEY: ${{ secrets.REB_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FEEDBACK_CSV_URL: ${{ secrets.FEEDBACK_CSV_URL }}
        run: python collector/collect.py --loop-minutes 345
      - name: 다음 수집 이어서 시작
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/collect.yml/dispatches" \
            -d '{"ref":"${{ github.ref_name }}"}'
