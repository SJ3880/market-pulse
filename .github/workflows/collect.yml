name: 실시간 수집

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: market-pulse-collector
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 1분 간격 수집 (최대 55분)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ECOS_KEY: ${{ secrets.ECOS_KEY }}
          REB_KEY: ${{ secrets.REB_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FEEDBACK_CSV_URL: ${{ secrets.FEEDBACK_CSV_URL }}
        run: python collector/collect.py --loop-minutes 55
