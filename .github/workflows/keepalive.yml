name: 자동 수집 유지

on:
  schedule:
    - cron: "17 0 1,15 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +"%Y-%m-%d %H:%M UTC" > keepalive.txt
          git config user.name "market-pulse-bot"
          git config user.email "market-pulse-bot@users.noreply.github.com"
          git add keepalive.txt
          git commit -m "keepalive" || exit 0
          git push
