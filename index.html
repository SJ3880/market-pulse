<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>마켓 펄스</title>
<meta name="description" content="경제·주식·부동산 핵심 이슈와 시장지표를 1분마다 갱신하는 개인 대시보드">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="assets/style.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#123A5A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="마켓 펄스">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23123A5A'/%3E%3Cpath d='M5 19h5l3-8 4 12 3-7h7' fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<script>
  // 데이터 위치를 직접 지정하고 싶을 때만 아래 줄의 주석을 풀어 주세요.
  // window.MP_DATA_BASE = "https://raw.githubusercontent.com/아이디/저장소이름/data/";
  // 불편사항 접수함 연결 (README '불편사항 접수' 참고) — form: 구글 설문 주소(끝을 formResponse 로), field: 내용 칸 번호
  window.MP_FEEDBACK = {
    form: "",          // 예) "https://docs.google.com/forms/d/e/1FAIpQ.../formResponse"
    field: "",         // 예) "entry.123456789"
    contactField: ""   // (선택) 연락처 칸 번호. 없으면 비워 두기
  };
  try { const t = localStorage.getItem("mp-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <a class="brand" href="#briefing" aria-label="마켓 펄스 처음으로">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 19h6l3.4-9 4.6 14 3.4-8H29"/></svg>
      <span>마켓 펄스</span>
    </a>
    <div class="status" id="status" role="status" aria-live="polite">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">불러오는 중</span>
    </div>
    <div class="top-actions">
      <button class="fb-btn" id="feedbackBtn" title="불편사항·의견 보내기">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H8l-4 4z"/><path d="M8 9h8M8 12h5"/></svg>
        <span>불편사항</span>
      </button>
      <button class="icon-btn" id="refreshBtn" title="지금 새로고침" aria-label="지금 새로고침">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg>
      </button>
      <button class="icon-btn" id="themeBtn" title="화면 밝기 전환" aria-label="화면 밝기 전환">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 13.5A8.5 8.5 0 1 1 10.5 3a7 7 0 0 0 10.5 10.5z"/></svg>
      </button>
    </div>
  </div>
  <div class="board" id="board" aria-label="주요 시장지표"></div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="분야">
    <button role="tab" data-tab="briefing">브리핑</button>
    <button role="tab" data-tab="economy">경제</button>
    <button role="tab" data-tab="stocks">주식시장</button>
    <button role="tab" data-tab="realestate">부동산</button>
    <button role="tab" data-tab="ipo">IPO</button>
    <button role="tab" data-tab="ib">IB</button>
    <button role="tab" data-tab="funding">비상장 투자</button>
    <button role="tab" data-tab="policy">정책·발표</button>
    <button role="tab" data-tab="timeline">하루 흐름</button>
    <button role="tab" data-tab="calendar">일정</button>
  </nav>
</header>

<main id="main" tabindex="-1">
  <div class="loading" id="loading">
    <div class="skel w60"></div><div class="skel w90"></div><div class="skel w80"></div><div class="skel w70"></div>
  </div>
</main>

<footer class="foot" id="foot"></footer>

<div class="qv" id="qv" hidden>
  <div class="qv-bg" data-close></div>
  <aside class="qv-panel" role="dialog" aria-modal="true" aria-labelledby="qvTitle">
    <button type="button" class="icon-btn qv-x" data-close aria-label="닫기">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div id="qvBody"></div>
  </aside>
</div>

<script src="assets/app.js"></script>
</body>
</html>
